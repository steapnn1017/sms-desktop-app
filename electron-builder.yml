appId: com.company.sms-desktop-app
productName: SMS Manager
copyright: Copyright © 2024

directories:
  output: release

files:
  - dist-electron/**/*
  - out/**/*
  - "!node_modules/**/*"
  - node_modules/.prisma/**/*
  - node_modules/@prisma/client/**/*
  - prisma/schema.prisma

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  requestedExecutionLevel: asInvoker

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: SMS Manager
  runAfterFinish: true